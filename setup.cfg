[metadata]
name = colcon-guard
version = attr: colcon_guard.__version__
description = Extension for colcon that guards builds against self-layered environments and concurrent builds
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
author = Jan Vojnar
author_email = jan.vojnar@vojnarautonomous.com
maintainer = Jan Vojnar
maintainer_email = jan.vojnar@vojnarautonomous.com
url = https://github.com/vojnar-autonomous/colcon-guard
project_urls =
    Homepage = https://vojnarautonomous.com
    Source = https://github.com/vojnar-autonomous/colcon-guard
classifiers =
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX
    Programming Language :: Python
    Topic :: Software Development :: Build Tools
keywords = colcon ros2 build

[options]
python_requires = >=3.9
install_requires =
    colcon-core
    tomli; python_version < "3.11"
packages = find:
zip_safe = true

[options.packages.find]
exclude =
    tests
    tests.*

[options.extras_require]
test =
    pytest
    colcon-ros
    colcon-python-setup-py
    colcon-recursive-crawl
    colcon-package-selection
    colcon-parallel-executor
    colcon-defaults
    colcon-test-result
    colcon-output
    colcon-package-information

[options.entry_points]
colcon_core.package_selection =
    guard = colcon_guard.selection:GuardPackageSelection
colcon_core.verb =
    guard = colcon_guard.verb.guard:GuardVerb

[tool:pytest]
testpaths = tests
norecursedirs = rig
markers =
    e2e: end-to-end tests running the real colcon on the workspaces in tests/rig
    ros: tests that need a sourced ROS 2 installation (skipped when none is found)

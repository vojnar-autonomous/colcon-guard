name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish to PyPI, create the tag and the GitHub release
          (unchecked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Real releases only from main
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "::error::publishing is only allowed from main"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: version
        run: |
          version=$(python -c 'import colcon_guard; print(colcon_guard.__version__)')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Preflight, this version must be new
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/colcon-guard/${VERSION}/json")
          if [ "${code}" != 404 ]; then
            echo "::error::PyPI answered ${code} for colcon-guard ${VERSION}, expected 404"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/colcon --log-base /dev/null guard status
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "${PUBLISH}" = "true" ]; then mode=RELEASE; else mode="DRY RUN"; fi
          echo "${mode}: colcon-guard ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
